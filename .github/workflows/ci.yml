name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**.md"
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
        with:
          version: 10.34.5

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22"
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Prevent Streamdown re-entry
        shell: bash
        run: |
          set -euo pipefail
          pnpm why streamdown --json > /tmp/streamdown-why.json
          node - <<'NODE'
          const fs = require('fs');
          const graph = JSON.parse(fs.readFileSync('/tmp/streamdown-why.json', 'utf8'));
          const serialized = JSON.stringify(graph);
          if (/"streamdown"/.test(serialized)) {
            console.error('Streamdown is present in the dependency graph; the hardened Prose renderer must remain the only markdown rendering path.');
            process.exit(1);
          }
          console.log('Streamdown absent from dependency graph.');
          NODE

      - name: Prevent legacy Vite runtime re-entry
        shell: bash
        run: |
          set -euo pipefail
          if pnpm why vite-plugin-manus-runtime --json | grep -q 'vite-plugin-manus-runtime'; then
            echo 'Legacy Vite runtime dependency re-entered the graph.' >&2
            exit 1
          fi
          echo 'Legacy Vite runtime absent from dependency graph.'

      - name: Typecheck, test, format, build
        run: pnpm run ci

      - name: Keep development observability out of production artifacts
        shell: bash
        run: |
          set -euo pipefail
          test ! -e dist/public/__peoples_dev__/observer.js
          test ! -e dist/public/__manus__/debug-collector.js
          if grep -RIl '/__peoples_dev__/telemetry' dist/public \
            --include='*.html' \
            --include='*.js' \
            --include='*.css' \
            --include='*.json' | grep -q .; then
            echo 'Development telemetry reference detected in production artifact.' >&2
            exit 1
          fi
          echo 'Production artifact contains no development observability payload.'
