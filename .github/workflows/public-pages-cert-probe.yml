name: Public Pages Certification Probe

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  pipeline:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 778b3b5ba73094b9abe345f41e29d08541ba6536

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
        with:
          version: 10.34.5

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm test

      - name: Reproduce Pages artifact
        shell: bash
        env:
          PEOPLES_STATIC_PAGES: "true"
        run: |
          set -euo pipefail
          pnpm exec vite build --base /peoples-portfolio/
          sed -i 's/data-trai-static="false"/data-trai-static="true"/' dist/public/index.html
          sed -i 's/__DEPLOY_COMMIT__/778b3b5ba73094b9abe345f41e29d08541ba6536/g' dist/public/index.html
          printf '%s\n' '778b3b5ba73094b9abe345f41e29d08541ba6536' > dist/public/deploy-commit.txt
          cp dist/public/index.html dist/public/404.html
          for route in materials community research gallery timeline; do
            mkdir -p "dist/public/$route"
            cp dist/public/index.html "dist/public/$route/index.html"
          done
          touch dist/public/.nojekyll

          test -s dist/public/index.html
          test -s dist/public/deploy-commit.txt
          grep -Fq '778b3b5ba73094b9abe345f41e29d08541ba6536' dist/public/index.html
          grep -Fq 'id="peoples-boot-fallback"' dist/public/index.html
          grep -Fq 'data-trai-static="true"' dist/public/index.html
          if grep -Eq '(src|href)="/assets/' dist/public/index.html; then exit 1; fi
          grep -Eq '(src|href)="/peoples-portfolio/assets/' dist/public/index.html

      - name: Execute reproduced artifact in headless Chrome
        id: chrome
        shell: bash
        continue-on-error: true
        run: |
          set -euo pipefail
          rm -rf /tmp/peoples-pages-root
          mkdir -p /tmp/peoples-pages-root/peoples-portfolio
          cp -a dist/public/. /tmp/peoples-pages-root/peoples-portfolio/
          python3 -m http.server 4173 --directory /tmp/peoples-pages-root >/tmp/peoples-pages-http.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          for _ in $(seq 1 30); do
            curl --fail --silent http://127.0.0.1:4173/peoples-portfolio/ >/dev/null && break
            sleep 1
          done
          chrome="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$chrome"
          "$chrome" --headless --no-sandbox --disable-gpu --enable-logging=stderr --virtual-time-budget=12000 --dump-dom http://127.0.0.1:4173/peoples-portfolio/ > /tmp/local-dom.html 2>/tmp/chrome-stderr.log

          {
            echo '=== DOM MARKERS ==='
            grep -o 'data-peoples-app-mounted="[^"]*"' /tmp/local-dom.html || true
            grep -o 'id="peoples-boot-fallback"' /tmp/local-dom.html || true
            grep -o 'JONATHAN PEOPLES' /tmp/local-dom.html | head || true
            echo '=== HTML SERVER LOG ==='
            cat /tmp/peoples-pages-http.log || true
          } > /tmp/probe-summary.txt

      - name: Upload browser evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: peoples-pages-browser-evidence
          path: |
            /tmp/local-dom.html
            /tmp/chrome-stderr.log
            /tmp/peoples-pages-http.log
            /tmp/probe-summary.txt
          retention-days: 3

      - name: Assert reproduced browser render
        shell: bash
        run: |
          set -euo pipefail
          cat /tmp/probe-summary.txt
          grep -Fq 'data-peoples-app-mounted="true"' /tmp/local-dom.html
          grep -Fq 'JONATHAN PEOPLES' /tmp/local-dom.html
          if grep -Fq 'id="peoples-boot-fallback"' /tmp/local-dom.html; then
            echo 'LOCAL_BROWSER_RENDER=FAIL_BOOT_FALLBACK_REMAINED' >&2
            exit 1
          fi
          echo 'LOCAL_PAGES_PIPELINE=PASS'

  live:
    needs: pipeline
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Verify exact deployed revision
        shell: bash
        run: |
          set -euo pipefail
          expected="778b3b5ba73094b9abe345f41e29d08541ba6536"
          base="https://heruahmose.github.io/peoples-portfolio"
          status="$(curl --silent --location --output /tmp/deploy-commit --write-out '%{http_code}' "${base}/deploy-commit.txt")"
          printf 'DEPLOY_COMMIT_HTTP_STATUS=%s\n' "$status"
          if [ "$status" != 200 ]; then
            echo 'PUBLIC_DEPLOYMENT_IDENTITY=FAIL_MISSING_CURRENT_ARTIFACT' >&2
            exit 1
          fi
          observed="$(cat /tmp/deploy-commit)"
          printf 'EXPECTED_DEPLOY_COMMIT=%s\n' "$expected"
          printf 'PUBLIC_DEPLOY_COMMIT=%s\n' "$observed"
          test "$observed" = "$expected"
          html="$(curl --fail --silent --show-error --location "${base}/")"
          printf '%s' "$html" | grep -Fq "$expected"
          printf '%s' "$html" | grep -Fq 'id="peoples-boot-fallback"'
          printf 'PUBLIC_HTTP_SHELL=PASS\n'

      - name: Execute the public URL in headless Chrome
        shell: bash
        run: |
          set -euo pipefail
          url="https://heruahmose.github.io/peoples-portfolio/"
          chrome="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$chrome"
          "$chrome" --headless --no-sandbox --disable-gpu --virtual-time-budget=12000 --dump-dom "$url" > /tmp/public-peoples-dom.html
          grep -Fq 'data-peoples-app-mounted="true"' /tmp/public-peoples-dom.html
          grep -Fq 'JONATHAN PEOPLES' /tmp/public-peoples-dom.html
          if grep -Fq 'id="peoples-boot-fallback"' /tmp/public-peoples-dom.html; then
            echo 'PUBLIC_BROWSER_RENDER=FAIL_BOOT_FALLBACK_REMAINED' >&2
            exit 1
          fi
          printf 'PUBLIC_BROWSER_RENDER=PASS\n'
