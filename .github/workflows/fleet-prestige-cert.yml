name: Fleet Prestige Certification

on:
  push:
    branches: [probe/fleet-prestige-cert-20260823]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  identity:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Require exact Pages deployment identities
        shell: bash
        run: |
          set -euo pipefail
          check_sha() {
            local url="$1" expected="$2" label="$3"
            observed="$(curl --fail --silent --show-error --location "$url" | tr -d '\r\n')"
            printf '%s expected=%s observed=%s\n' "$label" "$expected" "$observed"
            test "$observed" = "$expected"
          }
          check_sha 'https://heruahmose.github.io/peoples-portfolio/deploy-commit.txt' '9e7fa2a6d3395aef7a7cf31dca7d73e4eb664189' PEOPLES
          check_sha 'https://heruahmose.github.io/blue-gold-daily/deploy-commit.txt' 'd3b801a57e1c25713a1f1c2da838b0da741930bb' BLUE_GOLD
          check_sha 'https://heruahmose.github.io/trai-portfolio/deploy-commit.txt' '312fe89e9ba504bf749f361a09d2f5fadfd2fe6c' TRAI

  peoples:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Founder narrative browser gate
        shell: bash
        run: |
          set -euo pipefail
          chrome="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          timeout 60s "$chrome" --headless --no-sandbox --disable-gpu --virtual-time-budget=18000 --dump-dom 'https://heruahmose.github.io/peoples-portfolio/timeline/' > /tmp/site.html
          grep -Fq 'LINEAGE ENGINE' /tmp/site.html
          grep -Fq 'FOUNDER JOURNEY' /tmp/site.html
          grep -Fq 'SERVICE' /tmp/site.html
          grep -Fq 'INVENTION' /tmp/site.html
          echo 'PEOPLES_PRESTIGE=PASS'

  blue_gold:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Phi formulation browser gate
        shell: bash
        run: |
          set -euo pipefail
          chrome="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          timeout 60s "$chrome" --headless --no-sandbox --disable-gpu --virtual-time-budget=15000 --dump-dom 'https://heruahmose.github.io/blue-gold-daily/layers.html' > /tmp/site.html
          grep -Fq 'Φ ARCHITECTURE' /tmp/site.html
          grep -Fq 'LIVING INDEX' /tmp/site.html
          grep -Fq 'Sovereignty Loop' /tmp/site.html
          echo 'BLUE_GOLD_PRESTIGE=PASS'

  trai:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Estate organism browser gate
        shell: bash
        run: |
          set -euo pipefail
          chrome="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          timeout 60s "$chrome" --headless --no-sandbox --disable-gpu --virtual-time-budget=18000 --dump-dom 'https://heruahmose.github.io/trai-portfolio/' > /tmp/site.html
          grep -Eiq 'Seven regions|Seven functions|one memory|TRAI' /tmp/site.html
          echo 'TRAI_PRESTIGE=PASS'

  techbridge:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Digital equity infrastructure browser gate
        shell: bash
        run: |
          set -euo pipefail
          chrome="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          timeout 60s "$chrome" --headless --no-sandbox --disable-gpu --virtual-time-budget=18000 --dump-dom 'https://techbridge-collective.org/' > /tmp/site.html
          grep -Eiq 'TechBridge|Digital Equity' /tmp/site.html
          grep -Eiq 'ACCESS|NAVIGATION|SKILLS|TRUST|OPPORTUNITY' /tmp/site.html
          echo 'TECHBRIDGE_PRESTIGE=PASS'

  tamerian:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Material intelligence browser gate
        shell: bash
        run: |
          set -euo pipefail
          chrome="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          timeout 75s "$chrome" --headless --no-sandbox --disable-gpu --virtual-time-budget=22000 --dump-dom 'https://tamerian-materials.com/' > /tmp/site.html
          grep -Fq 'MATERIAL ATLAS' /tmp/site.html
          grep -Fq 'LIVE PHASE MAP' /tmp/site.html
          grep -Eiq 'TRANSFORMATION|DEVICE ARCHITECTURE|Material System' /tmp/site.html
          grep -Fq '0/7 missions' /tmp/site.html
          echo 'TAMERIAN_PRESTIGE=PASS'

  qc_legacy:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Diagnose legacy Firebase without accepting it
        shell: bash
        run: |
          set -euo pipefail
          code="$(curl --silent --show-error --location --output /tmp/qc-legacy --write-out '%{http_code}' 'https://queencalifia-cyberai.web.app/')"
          printf 'QC_LEGACY_HTTP=%s\n' "$code"
          test "$code" = 200
          if grep -Fq 'SOVEREIGN SEAL' /tmp/qc-legacy; then
            echo 'QC_LEGACY_PRESTIGE=CURRENT'
          else
            echo 'QC_LEGACY_PRESTIGE=STALE_EXPECTED_PENDING_MIGRATION'
          fi
