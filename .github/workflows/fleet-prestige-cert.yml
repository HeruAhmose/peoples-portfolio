name: Fleet Prestige Certification

on:
  push:
    branches: [probe/fleet-prestige-cert-20260823]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  certify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout probe host
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Require Chrome
        shell: bash
        run: |
          set -euo pipefail
          command -v google-chrome || command -v chromium || command -v chromium-browser

      - name: Require exact Pages deployment identities
        shell: bash
        run: |
          set -euo pipefail
          check_sha() {
            local url="$1" expected="$2" label="$3"
            observed="$(curl --fail --silent --show-error --location "$url" | tr -d '\r\n')"
            printf '%s expected=%s observed=%s\n' "$label" "$expected" "$observed"
            test "$observed" = "$expected"
          }
          check_sha 'https://heruahmose.github.io/peoples-portfolio/deploy-commit.txt' '9e7fa2a6d3395aef7a7cf31dca7d73e4eb664189' PEOPLES
          check_sha 'https://heruahmose.github.io/blue-gold-daily/deploy-commit.txt' 'd3b801a57e1c25713a1f1c2da838b0da741930bb' BLUE_GOLD
          check_sha 'https://heruahmose.github.io/trai-portfolio/deploy-commit.txt' '312fe89e9ba504bf749f361a09d2f5fadfd2fe6c' TRAI

      - name: Public HTTP fleet smoke
        shell: bash
        run: |
          set -euo pipefail
          for url in \
            'https://tamerian-materials.com/' \
            'https://heruahmose.github.io/peoples-portfolio/' \
            'https://heruahmose.github.io/peoples-portfolio/timeline/' \
            'https://techbridge-collective.org/' \
            'https://heruahmose.github.io/blue-gold-daily/' \
            'https://heruahmose.github.io/blue-gold-daily/layers.html' \
            'https://heruahmose.github.io/trai-portfolio/'; do
            code="$(curl --silent --show-error --location --output /tmp/body --write-out '%{http_code}' "$url")"
            printf '%s -> %s bytes=%s\n' "$url" "$code" "$(wc -c </tmp/body)"
            test "$code" = 200
            test -s /tmp/body
          done

      - name: Render prestige-specific public surfaces in Chrome
        shell: bash
        run: |
          set -euo pipefail
          chrome="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          render() {
            local url="$1" out="$2" budget="${3:-15000}"
            "$chrome" --headless --no-sandbox --disable-gpu --virtual-time-budget="$budget" --dump-dom "$url" > "$out"
            test -s "$out"
          }

          render 'https://heruahmose.github.io/peoples-portfolio/timeline/' /tmp/peoples.html 18000
          grep -Fq 'LINEAGE ENGINE' /tmp/peoples.html
          grep -Fq 'FOUNDER JOURNEY' /tmp/peoples.html
          grep -Fq 'SERVICE' /tmp/peoples.html
          grep -Fq 'INVENTION' /tmp/peoples.html
          grep -Fq 'SOVEREIGNTY' /tmp/peoples.html

          render 'https://heruahmose.github.io/blue-gold-daily/layers.html' /tmp/bluegold.html
          grep -Fq 'Φ ARCHITECTURE' /tmp/bluegold.html
          grep -Fq 'LIVING INDEX' /tmp/bluegold.html
          grep -Fq 'Sovereignty Loop' /tmp/bluegold.html

          render 'https://heruahmose.github.io/trai-portfolio/' /tmp/trai.html 18000
          grep -Eiq 'Seven regions|Seven functions|one memory|TRAI' /tmp/trai.html

          render 'https://techbridge-collective.org/' /tmp/techbridge.html 18000
          grep -Eiq 'TechBridge|Digital Equity' /tmp/techbridge.html
          grep -Eiq 'ACCESS|NAVIGATION|SKILLS|TRUST|OPPORTUNITY' /tmp/techbridge.html

          render 'https://tamerian-materials.com/' /tmp/tamerian.html 22000
          grep -Fq 'MATERIAL ATLAS' /tmp/tamerian.html
          grep -Fq 'LIVE PHASE MAP' /tmp/tamerian.html
          grep -Eiq 'TRANSFORMATION|DEVICE ARCHITECTURE|Material System' /tmp/tamerian.html
          grep -Fq '0/7 missions' /tmp/tamerian.html

          echo 'FLEET_PRESTIGE_PUBLIC_BROWSER=PASS'

      - name: Diagnose QC legacy surface without accepting it
        shell: bash
        run: |
          set -euo pipefail
          code="$(curl --silent --show-error --location --output /tmp/qc-legacy --write-out '%{http_code}' 'https://queencalifia-cyberai.web.app/')"
          printf 'QC_LEGACY_HTTP=%s\n' "$code"
          test "$code" = 200
          if grep -Fq 'SOVEREIGN SEAL' /tmp/qc-legacy; then
            echo 'QC_LEGACY_PRESTIGE=CURRENT'
          else
            echo 'QC_LEGACY_PRESTIGE=STALE_EXPECTED_PENDING_MIGRATION'
          fi
