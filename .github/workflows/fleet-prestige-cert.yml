name: Fleet Prestige Certification

on:
  push:
    branches: [probe/fleet-prestige-cert-20260823]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  identity:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Require exact current Pages deployment identities
        shell: bash
        run: |
          set -euo pipefail
          check_sha() {
            local url="$1" expected="$2" label="$3" observed=''
            for _ in $(seq 1 30); do
              observed="$(curl --fail --silent --show-error --location "$url" 2>/dev/null | tr -d '\r\n' || true)"
              [ "$observed" = "$expected" ] && break
              sleep 6
            done
            printf '%s expected=%s observed=%s\n' "$label" "$expected" "$observed"
            test "$observed" = "$expected"
          }
          check_sha 'https://heruahmose.github.io/peoples-portfolio/deploy-commit.txt' 'bfae70472a81842890b505c1a4d3cdcd6f531525' PEOPLES
          check_sha 'https://heruahmose.github.io/blue-gold-daily/deploy-commit.txt' 'bd6b7f05a0418fd532103b6c7b04d643ad1b896d' BLUE_GOLD
          check_sha 'https://heruahmose.github.io/trai-portfolio/deploy-commit.txt' 'b06c6c803dae9b21a56353b3666ca43ed51455a1' TRAI
          check_sha 'https://heruahmose.github.io/QueenCalifia-CyberAI/deploy-commit.txt' '59ccc43ecf22a8ded6a3d4e52600c983df57854d' QUEEN_CALIFIA
          echo 'FLEET_PAGES_IDENTITY=PASS'

  peoples:
    runs-on: ubuntu-24.04
    steps:
      - name: Founder narrative browser gate
        run: |
          chrome="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          timeout 60s "$chrome" --headless --no-sandbox --disable-gpu --virtual-time-budget=18000 --dump-dom 'https://heruahmose.github.io/peoples-portfolio/timeline/' > /tmp/site.html
          grep -Fq 'LINEAGE ENGINE' /tmp/site.html
          grep -Fq 'FOUNDER JOURNEY' /tmp/site.html
          grep -Fq 'SERVICE' /tmp/site.html
          grep -Fq 'INVENTION' /tmp/site.html
          echo 'PEOPLES_PRESTIGE=PASS'

  blue_gold:
    runs-on: ubuntu-24.04
    steps:
      - name: Phi formulation browser gate
        run: |
          chrome="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          timeout 60s "$chrome" --headless --no-sandbox --disable-gpu --virtual-time-budget=15000 --dump-dom 'https://heruahmose.github.io/blue-gold-daily/layers.html' > /tmp/site.html
          grep -Fq 'Φ ARCHITECTURE' /tmp/site.html
          grep -Fq 'LIVING INDEX' /tmp/site.html
          grep -Fq 'Sovereignty Loop' /tmp/site.html
          echo 'BLUE_GOLD_PRESTIGE=PASS'

  trai:
    runs-on: ubuntu-24.04
    steps:
      - name: Estate and civilization browser gate
        run: |
          chrome="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          timeout 45s "$chrome" --headless --no-sandbox --disable-gpu --disable-webgl --disable-software-rasterizer --virtual-time-budget=12000 --dump-dom 'https://heruahmose.github.io/trai-portfolio/' > /tmp/site.html
          test -s /tmp/site.html
          grep -Eiq 'Seven regions|Seven functions|one memory|TRAI' /tmp/site.html
          echo 'TRAI_PRESTIGE=PASS'

  techbridge:
    runs-on: ubuntu-24.04
    steps:
      - name: Digital equity infrastructure browser gate
        run: |
          chrome="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          timeout 60s "$chrome" --headless --no-sandbox --disable-gpu --virtual-time-budget=18000 --dump-dom 'https://techbridge-collective.org/' > /tmp/site.html
          grep -Eiq 'TechBridge|Digital Equity' /tmp/site.html
          grep -Eiq 'ACCESS|NAVIGATION|SKILLS|TRUST|OPPORTUNITY' /tmp/site.html
          echo 'TECHBRIDGE_PRESTIGE=PASS'

  tamerian:
    runs-on: ubuntu-24.04
    steps:
      - name: Material intelligence browser gate
        run: |
          chrome="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          timeout 75s "$chrome" --headless --no-sandbox --disable-gpu --virtual-time-budget=22000 --dump-dom 'https://tamerian-materials.com/' > /tmp/site.html
          grep -Fq 'MATERIAL ATLAS' /tmp/site.html
          grep -Fq 'LIVE PHASE MAP' /tmp/site.html
          grep -Eiq 'TRANSFORMATION|DEVICE ARCHITECTURE|Material System' /tmp/site.html
          grep -Fq '0/7 missions' /tmp/site.html
          echo 'TAMERIAN_PRESTIGE=PASS'

  queen_califia:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Wait for exact current public presentation
        shell: bash
        run: |
          set -euo pipefail
          base='https://heruahmose.github.io/QueenCalifia-CyberAI/'
          expected='59ccc43ecf22a8ded6a3d4e52600c983df57854d'
          observed=''
          for _ in $(seq 1 30); do
            observed="$(curl -fsSL "${base}deploy-commit.txt" 2>/dev/null | tr -d '\r\n' || true)"
            [ "$observed" = "$expected" ] && break
            sleep 6
          done
          echo "QC_PRESENTATION_SHA=$observed"
          test "$observed" = "$expected"
      - name: Current public presentation browser gate
        shell: bash
        run: |
          set -euo pipefail
          base='https://heruahmose.github.io/QueenCalifia-CyberAI/'
          chrome="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          timeout 60s "$chrome" --headless --no-sandbox --disable-gpu --virtual-time-budget=14000 --dump-dom "$base" > /tmp/qc.html
          grep -Fqi 'Queen Califia' /tmp/qc.html
          grep -Fqi 'SOVEREIGN COGNITIVE DEFENSE' /tmp/qc.html
          grep -Fqi 'HUMAN AUTHORITY' /tmp/qc.html
          echo 'QC_CURRENT_PRESENTATION=PASS'
      - name: Sovereign edge must remain dormant
        shell: bash
        run: |
          set -euo pipefail
          code="$(curl --silent --show-error --location --output /tmp/edge --write-out '%{http_code}' 'https://qc.tamerian-materials.com/' || true)"
          echo "QC_EDGE_HTTP=$code"
          test "$code" = 530
          grep -Fqi '1033' /tmp/edge
          echo 'QC_SOVEREIGN_EDGE_DORMANT=PASS'
      - name: Legacy Firebase remains noncanonical diagnostic
        shell: bash
        run: |
          code="$(curl --silent --show-error --location --output /tmp/legacy --write-out '%{http_code}' 'https://queencalifia-cyberai.web.app/')"
          echo "QC_LEGACY_FIREBASE_HTTP=$code"
          test "$code" = 200
          if grep -Fq 'SOVEREIGN SEAL' /tmp/legacy; then echo 'QC_LEGACY_FIREBASE=CURRENT'; else echo 'QC_LEGACY_FIREBASE=STALE_NONCANONICAL'; fi
