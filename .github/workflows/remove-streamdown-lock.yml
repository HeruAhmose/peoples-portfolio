name: Remove Streamdown lock graph

on:
  push:
    branches: [security/streamdown2-20260817]

permissions:
  contents: write

jobs:
  refresh-lock:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: security/streamdown2-20260817
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
        with:
          version: 10.34.5
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22"
          cache: pnpm
      - name: Remove unused Streamdown graph from lockfile
        run: pnpm install --lockfile-only --ignore-scripts
      - name: Materialize resolved graph without lifecycle scripts
        run: pnpm install --ignore-scripts
      - name: Format lockfile with repository policy
        run: pnpm exec prettier --write pnpm-lock.yaml
      - name: Preserve reviewed manifest
        run: git diff --exit-code -- package.json
      - name: Commit final lockfile and remove resolver
        run: |
          set -euo pipefail
          rm .github/workflows/remove-streamdown-lock.yml
          git add pnpm-lock.yaml .github/workflows/remove-streamdown-lock.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "build: remove unused Streamdown lock graph"
          git push origin HEAD:security/streamdown2-20260817
