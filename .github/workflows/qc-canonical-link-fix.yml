name: Temporary QC Canonical Link Fix

on:
  push:
    branches: [fix/qc-canonical-link-20260823]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/qc-canonical-link-20260823
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
      - name: Patch stale Queen Califia public references
        shell: python
        run: |
          from pathlib import Path
          p = Path('client/src/pages/Home.tsx')
          s = p.read_text()
          s = s.replace('https://queencalifia-cyberai.web.app/', 'https://qc.tamerian-materials.com/')
          s = s.replace('Sovereign cybersecurity intelligence — sovereign awakening experience', 'Sovereign cybersecurity intelligence — human-authority command architecture')
          s = s.replace('Sovereign cybersecurity intelligence — interactive sovereign\n                  awakening sequence with hex mesh telemetry, cinematic\n                  transition geometry, and transition matrix — matching the\n                  public experience on the live Firebase app.', 'Sovereign cybersecurity intelligence with a human-authority command architecture, provenance-aware decision framing, and a sovereign awakening interface. The canonical public runtime is transitioning away from the legacy Firebase presentation, so this portfolio does not certify that older surface as current.')
          p.write_text(s)
      - name: Format changed source
        run: npx prettier --write client/src/pages/Home.tsx
      - name: Commit application change
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- client/src/pages/Home.tsx; then
            echo 'No application changes required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add client/src/pages/Home.tsx
          git commit -m 'fix(content): point QC references at canonical runtime'
          git push origin HEAD:fix/qc-canonical-link-20260823
