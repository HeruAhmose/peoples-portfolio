name: Harden Peoples experience audit temp

on:
  push:
    branches:
      - fix/experience-runtime-20260910

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
        with:
          version: 10.34.5
          run_install: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Remove environment-controlled browser endpoints
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('scripts/audit-experience-runtime.mjs')
          s=p.read_text(encoding='utf-8')
          old='''const CDP_HTTP = process.env.PEOPLES_CDP_URL || "http://127.0.0.1:9222";\nconst BASE =\n  process.env.PEOPLES_BASE_URL || "http://127.0.0.1:4173/peoples-portfolio/";'''
          new='''const CDP_HTTP = "http://127.0.0.1:9222";\nconst BASE = "http://127.0.0.1:4173/peoples-portfolio/";'''
          if old not in s:
              raise SystemExit('Peoples audit endpoint contract not found')
          p.write_text(s.replace(old,new,1), encoding='utf-8')
          PY
          pnpm exec prettier --write scripts/audit-experience-runtime.mjs
          pnpm exec prettier --check scripts/audit-experience-runtime.mjs
          git diff --check
          git config user.name 'Heru_Ahmose'
          git config user.email 'aitconsult22@gmail.com'
          git add scripts/audit-experience-runtime.mjs
          git commit -m 'fix(ci): harden Peoples browser audit against SSRF'
          git push origin HEAD:fix/experience-runtime-20260910
