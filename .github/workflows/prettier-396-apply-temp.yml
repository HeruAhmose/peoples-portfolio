name: Prettier 3.9.6 Apply Temp

on:
  push:
    branches:
      - security/prettier-3.9.6-protected-v2

permissions:
  contents: write

jobs:
  apply:
    if: github.event.head_commit.message != 'style: apply Prettier 3.9.6 formatting'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: security/prettier-3.9.6-protected-v2
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
        with:
          version: 10.34.5
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply exact formatter output
        run: |
          pnpm exec prettier --write \
            client/src/components/TechMinutesDashboard.tsx \
            client/src/data/founderMedia.ts \
            client/src/hooks/useAudioSystem.ts \
            server/_core/llm.ts \
            shared/projectGallery.ts
          git diff --check
      - name: Commit formatter-only changes
        run: |
          if git diff --quiet; then
            echo 'FORMAT_CHANGES=NONE'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            client/src/components/TechMinutesDashboard.tsx \
            client/src/data/founderMedia.ts \
            client/src/hooks/useAudioSystem.ts \
            server/_core/llm.ts \
            shared/projectGallery.ts
          git commit -m 'style: apply Prettier 3.9.6 formatting'
          git push origin HEAD:security/prettier-3.9.6-protected-v2
