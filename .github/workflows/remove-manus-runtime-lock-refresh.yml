name: Remove legacy runtime dependency

on:
  push:
    branches: [build/vite8-20260817]
    paths:
      - .github/workflows/remove-manus-runtime-lock-refresh.yml

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: build/vite8-20260817
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
        with:
          version: 10.34.5
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22"
          cache: pnpm
      - name: Remove legacy runtime dependency
        run: pnpm remove -D vite-plugin-manus-runtime
      - name: Materialize without lifecycle scripts
        run: pnpm install --ignore-scripts
      - name: Format generated files
        run: pnpm exec prettier --write package.json pnpm-lock.yaml vite.config.ts server/_core/vite.ts client/public/__peoples_dev__/observer.js
      - name: Verify Vite-only major and legacy runtime removal
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const p = require('./package.json');
          if (p.devDependencies?.vite !== '8.1.5') throw new Error('Vite 8.1.5 must remain pinned for this migration');
          if (p.devDependencies?.['@vitejs/plugin-react'] !== '^5.0.4') throw new Error('plugin-react must remain on v5 until Vite 8 lands');
          if (p.devDependencies?.['vite-plugin-manus-runtime']) throw new Error('Legacy runtime dependency still present');
          NODE
          if git grep -nEi 'manus' -- ':!pnpm-lock.yaml' ':!README.md' ':!.github/workflows/remove-manus-runtime-lock-refresh.yml'; then
            echo 'Unexpected legacy vendor source/config references remain.' >&2
            exit 1
          fi
      - name: Restrict generated dependency changes
        shell: bash
        run: |
          set -euo pipefail
          unexpected="$(git status --porcelain --untracked-files=no | grep -Ev '^ M (package.json|pnpm-lock.yaml|vite.config.ts|server/_core/vite.ts|client/public/__peoples_dev__/observer.js)$' || true)"
          test -z "$unexpected"
      - name: Commit generated graph
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json pnpm-lock.yaml vite.config.ts server/_core/vite.ts client/public/__peoples_dev__/observer.js
          git diff --cached --quiet && exit 0
          git commit -m "build: remove legacy runtime dependency graph"
          git push
