name: plugin-react 6 lock refresh

on:
  push:
    branches: [build/plugin-react6-20260817]
    paths:
      - .github/workflows/plugin-react6-lock-refresh.yml

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: build/plugin-react6-20260817
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
        with:
          version: 10.34.5
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22"
          cache: pnpm
      - name: Upgrade plugin-react only
        shell: bash
        run: |
          set -euo pipefail
          pnpm add -D @vitejs/plugin-react@6.0.5
          pnpm pkg set 'devDependencies.@vitejs/plugin-react=6.0.5'
      - name: Verify Vite stays pinned
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const p = require('./package.json');
          if (p.devDependencies?.vite !== '8.1.5') throw new Error('Vite changed during plugin-react-only migration');
          if (p.devDependencies?.['@vitejs/plugin-react'] !== '6.0.5') throw new Error('plugin-react 6.0.5 not pinned');
          NODE
      - name: Materialize without lifecycle scripts
        run: pnpm install --ignore-scripts
      - name: Format generated files
        run: pnpm exec prettier --write package.json pnpm-lock.yaml
      - name: Restrict generated changes
        shell: bash
        run: |
          set -euo pipefail
          unexpected="$(git status --porcelain --untracked-files=no | grep -Ev '^ M (package.json|pnpm-lock.yaml)$' || true)"
          test -z "$unexpected"
      - name: Commit generated graph
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json pnpm-lock.yaml
          git diff --cached --quiet && exit 0
          git commit -m "build: migrate plugin-react to 6.0.5"
          git push
