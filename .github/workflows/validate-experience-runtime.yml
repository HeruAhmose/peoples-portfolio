name: Validate Peoples experience runtime

on:
  push:
    branches:
      - fix/experience-runtime-20260910

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
        with:
          version: 10.34.5
          run_install: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24"
          cache: pnpm
      - name: Apply exact repair
        run: python3 scripts/apply-experience-runtime-repair.py
      - name: Verify scope and contracts
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          changed="$(git diff --name-only | sort)"
          expected=$'client/src/App.tsx\nclient/src/components/Navigation.tsx\nclient/src/hooks/useAudioSystem.ts\npackage.json'
          printf '%s\n' "$changed"
          test "$changed" = "$expected"
          grep -Fq 'useState(true)' client/src/hooks/useAudioSystem.ts
          grep -Fq 'data-peoples-sound' client/src/components/Navigation.tsx
          grep -Fq 'audit-experience-runtime.mjs' package.json
          test -z "$(git diff --name-only -- pnpm-lock.yaml)"
      - name: Install locked graph
        run: pnpm install --frozen-lockfile
      - name: Format permanent experience audit
        run: pnpm exec prettier --write scripts/audit-experience-runtime.mjs
      - name: Static checks
        run: |
          pnpm audit --audit-level=high
          pnpm check
          pnpm test
          pnpm format:check
      - name: Build Pages-base artifact
        env:
          PEOPLES_STATIC_PAGES: "true"
        run: pnpm exec vite build --base /peoples-portfolio/
      - name: Materialize Pages topology
        shell: bash
        run: |
          set -euo pipefail
          cp dist/public/index.html dist/public/404.html
          for route in materials community research gallery timeline; do
            mkdir -p "dist/public/$route"
            cp dist/public/index.html "dist/public/$route/index.html"
          done
          rm -rf /tmp/peoples-pages-root /tmp/peoples-browser-profile
          mkdir -p /tmp/peoples-pages-root/peoples-portfolio
          cp -a dist/public/. /tmp/peoples-pages-root/peoples-portfolio/
      - name: Browser-certify existing estate plus audio/motion runtime
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 4173 --directory /tmp/peoples-pages-root >/tmp/peoples-http.log 2>&1 &
          server_pid=$!
          chrome="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          "$chrome" --headless --no-sandbox --disable-gpu --disable-dev-shm-usage --remote-debugging-port=9222 --remote-allow-origins='*' --user-data-dir=/tmp/peoples-browser-profile about:blank >/tmp/peoples-chrome.log 2>&1 &
          chrome_pid=$!
          trap 'kill "$chrome_pid" "$server_pid" 2>/dev/null || true' EXIT
          for _ in $(seq 1 50); do curl --fail --silent http://127.0.0.1:9222/json/version >/dev/null && break; sleep .25; done
          curl --fail --silent http://127.0.0.1:9222/json/version >/dev/null
          pnpm audit:built
          cat peoples-browser-audit.json
          cat peoples-experience-audit.json
      - name: Commit verified production changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Heru_Ahmose'
          git config user.email 'aitconsult22@gmail.com'
          git add client/src/App.tsx client/src/components/Navigation.tsx client/src/hooks/useAudioSystem.ts package.json scripts/audit-experience-runtime.mjs
          git commit -m 'fix(experience): require explicit Peoples audio opt-in'
          git push origin HEAD:fix/experience-runtime-20260910
