name: Streamdown 2 lockfile refresh

on:
  push:
    branches: [security/streamdown2-20260817]

permissions:
  contents: write

jobs:
  refresh-lock:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: security/streamdown2-20260817

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
        with:
          version: 10.34.5

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22"
          cache: pnpm

      - name: Refresh Streamdown lock graph
        run: pnpm update streamdown@2.5.0 --lockfile-only --ignore-scripts

      - name: Preserve reviewed manifest
        run: git diff --exit-code -- package.json

      - name: Commit lockfile and remove resolver
        run: |
          set -euo pipefail
          rm .github/workflows/streamdown2-lock-refresh.yml
          git add pnpm-lock.yaml .github/workflows/streamdown2-lock-refresh.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "build: refresh Streamdown 2 lock graph"
          git push origin HEAD:security/streamdown2-20260817
