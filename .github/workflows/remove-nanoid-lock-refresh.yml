name: Remove unused nanoid direct dependency

on:
  push:
    branches: [security/remove-unused-nanoid-20260817]
    paths:
      - .github/workflows/remove-nanoid-lock-refresh.yml

permissions:
  contents: write

jobs:
  remove:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: security/remove-unused-nanoid-20260817
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
        with:
          version: 10.34.5
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22"
          cache: pnpm
      - name: Remove direct dependency
        run: pnpm remove nanoid
      - name: Materialize without lifecycle scripts
        run: pnpm install --ignore-scripts
      - name: Format generated files
        run: pnpm exec prettier --write package.json pnpm-lock.yaml
      - name: Preserve transitive nanoid overrides and restrict changes
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const p = require('./package.json');
          if (p.pnpm?.overrides?.['tailwindcss>nanoid'] !== '3.3.7') process.exit(1);
          if (p.pnpm?.overrides?.['postcss>nanoid'] !== '3.3.18') process.exit(1);
          NODE
          unexpected="$(git status --porcelain --untracked-files=no | grep -Ev '^ M (package.json|pnpm-lock.yaml)$' || true)"
          test -z "$unexpected"
      - name: Commit dependency removal
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json pnpm-lock.yaml
          git diff --cached --quiet && exit 0
          git commit -m "build: remove unused direct nanoid dependency"
          git push
