name: nanoid 6 lock refresh

on:
  push:
    branches: [build/nanoid6-20260817]
    paths:
      - .github/workflows/nanoid6-lock-refresh.yml

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: build/nanoid6-20260817
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
        with:
          version: 10.34.5
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22"
          cache: pnpm
      - name: Upgrade direct nanoid
        run: pnpm add nanoid@6.0.0
      - name: Materialize without lifecycle scripts
        run: pnpm install --ignore-scripts
      - name: Format generated files
        run: pnpm exec prettier --write package.json pnpm-lock.yaml
      - name: Preserve transitive nanoid overrides and restrict changes
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const p = require('./package.json');
          if (p.pnpm?.overrides?.['tailwindcss>nanoid'] !== '3.3.7') process.exit(1);
          if (p.pnpm?.overrides?.['postcss>nanoid'] !== '3.3.18') process.exit(1);
          NODE
          unexpected="$(git status --porcelain --untracked-files=no | grep -Ev '^ M (package.json|pnpm-lock.yaml)$' || true)"
          test -z "$unexpected"
      - name: Commit generated graph
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json pnpm-lock.yaml
          git diff --cached --quiet && exit 0
          git commit -m "build: migrate nanoid to 6.0.0"
          git push
