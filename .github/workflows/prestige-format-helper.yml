name: prestige-format-helper
on:
  push:
    branches: [feat/prestige-system-20260823]
permissions:
  contents: write
jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/prestige-system-20260823
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
        with:
          version: 10.34.5
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm prettier --write client/src/pages/CareerTimeline.tsx client/src/components/PatentClaimsExplorer.tsx shared/portfolioCareerTimelineMilestone.ts
      - name: Commit formatted files
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name github-actions[bot]
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add client/src/pages/CareerTimeline.tsx client/src/components/PatentClaimsExplorer.tsx shared/portfolioCareerTimelineMilestone.ts
          git commit -m 'style(prestige): apply repository formatting'
          git push origin HEAD:feat/prestige-system-20260823
