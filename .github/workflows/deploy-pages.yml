name: Deploy Peoples Portfolio

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: peoples-portfolio-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
        with:
          version: 10.34.5
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm check

      - name: Tests
        run: pnpm test

      - name: Configure GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d

      - name: Build static portfolio
        env:
          PEOPLES_STATIC_PAGES: "true"
        run: pnpm exec vite build --base /peoples-portfolio/

      - name: Materialize and validate Pages artifact
        shell: bash
        run: |
          set -euo pipefail

          # The deployed shell is a static world. Keep server-hosted builds free
          # to use SPA transitions while making Pages navigation explicit.
          sed -i 's/data-trai-static="false"/data-trai-static="true"/' dist/public/index.html
          sed -i "s/__DEPLOY_COMMIT__/${GITHUB_SHA}/g" dist/public/index.html
          printf '%s\n' "$GITHUB_SHA" > dist/public/deploy-commit.txt

          cp dist/public/index.html dist/public/404.html
          for route in materials community research gallery timeline; do
            mkdir -p "dist/public/$route"
            cp "dist/public/index.html" "dist/public/$route/index.html"
          done
          touch dist/public/.nojekyll

          test -s dist/public/index.html
          test -s dist/public/deploy-commit.txt
          grep -Fq "$GITHUB_SHA" dist/public/index.html
          grep -Fq 'id="peoples-boot-fallback"' dist/public/index.html
          grep -Fq 'data-trai-static="true"' dist/public/index.html

          if grep -Eq '(src|href)="/assets/' dist/public/index.html; then
            echo "::error::Root-relative Vite asset reference detected."
            exit 1
          fi

          if ! grep -Eq '(src|href)="/peoples-portfolio/assets/' dist/public/index.html; then
            echo "::error::Expected /peoples-portfolio/-prefixed Vite asset reference not found."
            exit 1
          fi

          if grep -RIn 'manus\.computer' dist/public \
            --include='*.html' \
            --include='*.js' \
            --include='*.css' \
            --include='*.json'; then
            echo "::error::Temporary Manus runtime reference detected in Pages artifact."
            exit 1
          fi

          founder_assets=(
            'media/founder/football/kannapolis-action.webp'
            'media/founder/navy/academy-yearbook.webp'
            'media/founder/hero/founder-present-portrait.webp'
          )
          for asset in "${founder_assets[@]}"; do
            test -s "dist/public/$asset"
            grep -R -Fq "/peoples-portfolio/$asset" dist/public/assets
          done

          if grep -RInE '["`]/media/founder/' dist/public/assets; then
            echo "::error::Root-relative founder media reference detected."
            exit 1
          fi

          grep -R -Fq 'https://heruahmose.github.io/QueenCalifia-CyberAI/' dist/public/assets
          grep -R -Fq 'Operating under §508(c)(1)(A)' dist/public/assets
          grep -R -Fq 'Mandate of Mistrust' dist/public/assets

          if grep -RIn 'queencalifia-cyberai.web.app' dist/public; then
            echo "::error::Retired Queen Califia endpoint detected."
            exit 1
          fi

      - name: Execute static site in headless Chrome
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/peoples-pages-root
          mkdir -p /tmp/peoples-pages-root/peoples-portfolio
          cp -a dist/public/. /tmp/peoples-pages-root/peoples-portfolio/

          python3 -m http.server 4173 --directory /tmp/peoples-pages-root >/tmp/peoples-pages-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT

          for _ in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4173/peoples-portfolio/ >/dev/null; then
              break
            fi
            sleep 1
          done

          CHROME_BIN="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          if [ -z "$CHROME_BIN" ]; then
            echo "::error::Headless Chrome/Chromium is unavailable on the runner."
            exit 1
          fi

          "$CHROME_BIN" \
            --headless \
            --no-sandbox \
            --disable-gpu \
            --virtual-time-budget=9000 \
            --dump-dom \
            http://127.0.0.1:4173/peoples-portfolio/ \
            > /tmp/peoples-pages-dom.html

          grep -Fq 'data-peoples-app-mounted="true"' /tmp/peoples-pages-dom.html
          grep -Fq 'JONATHAN PEOPLES' /tmp/peoples-pages-dom.html
          if grep -Fq 'id="peoples-boot-fallback"' /tmp/peoples-pages-dom.html; then
            echo "::error::React never replaced the boot fallback."
            exit 1
          fi

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist/public

  deploy:
    runs-on: ubuntu-latest
    needs: build

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128

      - name: Verify public deployment identity
        shell: bash
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          base="${PAGE_URL%/}/"

          for _ in $(seq 1 30); do
            observed="$(curl --fail --silent --show-error "${base}deploy-commit.txt" 2>/dev/null || true)"
            if [ "$observed" = "$GITHUB_SHA" ]; then
              printf 'PUBLIC_DEPLOY_COMMIT=%s\n' "$observed"
              break
            fi
            sleep 2
          done

          observed="$(curl --fail --silent --show-error "${base}deploy-commit.txt")"
          test "$observed" = "$GITHUB_SHA"

          for asset in \
            'media/founder/football/kannapolis-action.webp' \
            'media/founder/navy/academy-yearbook.webp' \
            'media/founder/hero/founder-present-portrait.webp'; do
            curl --fail --silent --show-error "${base}${asset}" >/dev/null
          done

          html="$(curl --fail --silent --show-error "$base")"
          printf '%s' "$html" | grep -Fq "$GITHUB_SHA"
          printf '%s' "$html" | grep -Fq 'id="peoples-boot-fallback"'
