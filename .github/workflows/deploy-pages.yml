name: Deploy Peoples Portfolio

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: peoples-portfolio-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
        with:
          version: 10.34.5
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm check

      - name: Tests
        run: pnpm test

      - name: Configure GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d

      - name: Build static portfolio
        env:
          PEOPLES_STATIC_PAGES: "true"
        run: pnpm exec vite build --base /peoples-portfolio/

      - name: Validate Pages artifact
        shell: bash
        run: |
          cp dist/public/index.html dist/public/404.html
          # PEOPLES PAGES /// materialize SPA routes for HTTP 200 deep links
          for route in materials community research gallery timeline; do
            mkdir -p "dist/public/$route"
            cp "dist/public/index.html" "dist/public/$route/index.html"
          done
          touch dist/public/.nojekyll

          if grep -Eq '(src|href)="/assets/' dist/public/index.html; then
            echo "::error::Root-relative Vite asset reference detected."
            exit 1
          fi

          grep -q '/peoples-portfolio/assets/' dist/public/index.html

          if grep -RIn 'manus\.computer' dist/public \
            --include='*.html' \
            --include='*.js' \
            --include='*.css' \
            --include='*.json'; then
            echo "::error::Temporary Manus runtime reference detected in Pages artifact."
            exit 1
          fi

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b
        with:
          path: dist/public

  deploy:
    runs-on: ubuntu-latest
    needs: build

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128
