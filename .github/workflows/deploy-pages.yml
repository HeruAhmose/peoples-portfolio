name: Verify and Deploy Peoples Portfolio

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: peoples-portfolio-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
        with:
          version: 10.34.5
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: pnpm

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Type and verified-facts check
        run: pnpm check

      - name: Unit and regression tests
        run: pnpm test

      - name: Formatting check
        run: pnpm format:check

      - name: Build static portfolio
        env:
          PEOPLES_STATIC_PAGES: "true"
        run: pnpm exec vite build --base /peoples-portfolio/

      - name: Materialize and validate Pages artifact
        shell: bash
        run: |
          set -euo pipefail

          sed -i 's/data-trai-static="false"/data-trai-static="true"/' dist/public/index.html
          sed -i "s/__DEPLOY_COMMIT__/${GITHUB_SHA}/g" dist/public/index.html
          printf '%s\n' "$GITHUB_SHA" > dist/public/deploy-commit.txt

          cp dist/public/index.html dist/public/404.html
          for route in materials community research gallery timeline; do
            mkdir -p "dist/public/$route"
            cp dist/public/index.html "dist/public/$route/index.html"
          done
          touch dist/public/.nojekyll

          test -s dist/public/index.html
          test -s dist/public/deploy-commit.txt
          grep -Fq "$GITHUB_SHA" dist/public/index.html
          grep -Fq 'id="peoples-boot-fallback"' dist/public/index.html
          grep -Fq 'data-trai-static="true"' dist/public/index.html

          if grep -Eq '(src|href)="/assets/' dist/public/index.html; then
            echo "::error::Root-relative Vite asset reference detected."
            exit 1
          fi

          if ! grep -Eq '(src|href)="/peoples-portfolio/assets/' dist/public/index.html; then
            echo "::error::Expected /peoples-portfolio/-prefixed Vite asset reference not found."
            exit 1
          fi

          founder_assets=(
            'media/founder/football/kannapolis-action.webp'
            'media/founder/navy/academy-yearbook.webp'
            'media/founder/hero/founder-present-portrait.webp'
          )
          for asset in "${founder_assets[@]}"; do
            test -s "dist/public/$asset"
            grep -R -Fq "/peoples-portfolio/$asset" dist/public/assets
          done

          grep -R -Fq 'https://heruahmose.github.io/QueenCalifia-CyberAI/' dist/public/assets
          grep -R -Fq 'EIN obtained · tax-exempt status pending counsel confirmation' dist/public/assets
          grep -R -Fq 'Mandate of Mistrust' dist/public/assets
          grep -R -Fq 'one living Sovereignty Stack' dist/public/assets
          grep -R -Fq 'USER-PACED' dist/public/assets
          grep -R -Fq 'Skip intro' dist/public/assets
          grep -R -Fq 'Planned model · not operating' dist/public/assets

          if grep -RInE \
            'manus\.computer|queencalifia-cyberai\.web\.app|qc\.tamerian-materials\.com|§508\(c\)\(1\)\(A\)|CONNECTED VENTURES|impact score|impactScore|human-controlled autonomy|358 tests|376 tests|403 passing tests' \
            dist/public \
            --include='*.html' \
            --include='*.js' \
            --include='*.css' \
            --include='*.json'; then
            echo "::error::Retired endpoint, holding-company language, or unsupported public claim detected."
            exit 1
          fi

          if grep -RInE '["`]/media/founder/' dist/public/assets; then
            echo "::error::Root-relative founder media reference detected."
            exit 1
          fi

      - name: Execute full built-site browser matrix
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/peoples-pages-root /tmp/peoples-browser-profile
          mkdir -p /tmp/peoples-pages-root/peoples-portfolio
          cp -a dist/public/. /tmp/peoples-pages-root/peoples-portfolio/

          python3 -m http.server 4173 --directory /tmp/peoples-pages-root \
            >/tmp/peoples-pages-http.log 2>&1 &
          server_pid=$!

          chrome="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          if [ -z "$chrome" ]; then
            echo "::error::Headless Chrome/Chromium is unavailable on the runner."
            exit 1
          fi

          "$chrome" \
            --headless \
            --no-sandbox \
            --disable-gpu \
            --disable-dev-shm-usage \
            --remote-debugging-port=9222 \
            --remote-allow-origins='*' \
            --user-data-dir=/tmp/peoples-browser-profile \
            about:blank >/tmp/peoples-chrome.log 2>&1 &
          chrome_pid=$!
          trap 'kill "$chrome_pid" "$server_pid" 2>/dev/null || true; cat /tmp/peoples-chrome.log || true; cat /tmp/peoples-pages-http.log || true' EXIT

          for _ in $(seq 1 240); do
            if curl --fail --silent http://127.0.0.1:9222/json/version >/dev/null; then
              break
            fi
            sleep 0.25
          done
          curl --fail --silent http://127.0.0.1:9222/json/version >/dev/null

          pnpm audit:built

          if grep -Fq '/api/trpc' /tmp/peoples-pages-http.log; then
            echo '::error::Static Pages runtime attempted a server-only tRPC request.'
            exit 1
          fi

      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: peoples-browser-evidence-${{ github.sha }}
          path: |
            peoples-browser-audit.json
            peoples-browser-captures/
          if-no-files-found: warn

      - name: Configure GitHub Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d

      - name: Upload GitHub Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist/public

  deploy:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128

      - name: Verify public deployment identity and assets
        shell: bash
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          base="${PAGE_URL%/}/"

          for _ in $(seq 1 30); do
            observed="$(curl --fail --silent --show-error "${base}deploy-commit.txt" 2>/dev/null || true)"
            if [ "$observed" = "$GITHUB_SHA" ]; then
              printf 'PUBLIC_DEPLOY_COMMIT=%s\n' "$observed"
              break
            fi
            sleep 2
          done

          observed="$(curl --fail --silent --show-error "${base}deploy-commit.txt")"
          test "$observed" = "$GITHUB_SHA"

          for path in \
            '' \
            'materials/' \
            'community/' \
            'research/' \
            'gallery/' \
            'timeline/' \
            'media/founder/football/kannapolis-action.webp' \
            'media/founder/navy/academy-yearbook.webp' \
            'media/founder/hero/founder-present-portrait.webp'; do
            curl --fail --silent --show-error "${base}${path}" >/dev/null
          done

          html="$(curl --fail --silent --show-error "$base")"
          printf '%s' "$html" | grep -Fq "$GITHUB_SHA"
          printf '%s' "$html" | grep -Fq 'id="peoples-boot-fallback"'
