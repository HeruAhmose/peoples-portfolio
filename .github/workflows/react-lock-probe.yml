name: React Lockfile Probe

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  lock:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/react-runtime-coherence-pages-20260823
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
        with:
          version: 10.34.5
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
      - name: Generate matching lockfile only
        run: pnpm install --lockfile-only --no-frozen-lockfile
      - name: Verify aligned React packages
        run: |
          grep -Fq "react-dom:" pnpm-lock.yaml
          grep -Fq "react-is:" pnpm-lock.yaml
      - name: Commit generated lockfile only
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- pnpm-lock.yaml; then
            echo 'LOCKFILE_ALREADY_CURRENT=YES'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pnpm-lock.yaml
          git commit -m 'fix(runtime): align React renderer lockfile'
          git push origin HEAD:fix/react-runtime-coherence-pages-20260823
