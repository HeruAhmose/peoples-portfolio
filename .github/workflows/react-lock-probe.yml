name: React Lockfile Probe

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lock:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
        with:
          version: 10.34.5
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
      - name: Generate matching lockfile only
        run: pnpm install --lockfile-only --no-frozen-lockfile
      - name: Verify aligned React packages
        run: |
          grep -Fq "react-dom:" pnpm-lock.yaml
          grep -Fq "react-is:" pnpm-lock.yaml
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: react-coherence-lockfile
          path: pnpm-lock.yaml
          retention-days: 3
