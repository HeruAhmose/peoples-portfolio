name: moderate3-remediate

on:
  push:
    branches:
      - agent/moderate3-transitive-security-20260816

permissions:
  contents: write

jobs:
  remediate-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.5

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Regenerate lockfile deterministically
        run: pnpm install --lockfile-only

      - name: Install from regenerated lockfile
        run: pnpm install --frozen-lockfile

      - name: Full CI
        run: pnpm run ci

      - name: Audit gate — zero moderate or higher
        run: pnpm audit --audit-level=moderate

      - name: Show security diff
        run: git diff -- package.json pnpm-lock.yaml

      - name: Commit regenerated lockfile when changed
        shell: bash
        run: |
          if git diff --quiet -- pnpm-lock.yaml; then
            echo "Lockfile already synchronized."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml
          git commit -m "chore(security): regenerate lockfile for moderate fixes"
          git push origin HEAD:agent/moderate3-transitive-security-20260816
