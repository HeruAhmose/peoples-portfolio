name: Prettier 3.9.6 Format Probe

on:
  push:
    branches:
      - probe/prettier-396-format-diff
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
        with:
          version: 10.34.5
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format only flagged files
        run: |
          pnpm exec prettier --write \
            client/src/components/TechMinutesDashboard.tsx \
            client/src/data/founderMedia.ts \
            client/src/hooks/useAudioSystem.ts \
            server/_core/llm.ts \
            shared/projectGallery.ts
      - name: Print deterministic diff
        run: |
          echo '=== PRETTIER_3_9_6_DIFF_BEGIN ==='
          git --no-pager diff -- \
            client/src/components/TechMinutesDashboard.tsx \
            client/src/data/founderMedia.ts \
            client/src/hooks/useAudioSystem.ts \
            server/_core/llm.ts \
            shared/projectGallery.ts
          echo '=== PRETTIER_3_9_6_DIFF_END ==='
